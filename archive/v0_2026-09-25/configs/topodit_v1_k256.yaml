# ==========================================
# Topo-DiT V1 配置 (Latent Dim 1024, K=256)
# ==========================================

model:
  dim: 1024                 # 3D VAE Latent 的特征维度
  cond_dim: 512             # 文本条件 (如 T5/CLIP) 的嵌入维度
  num_elements: 256         # K: 拓扑实体域的数量 (将数万 Grid 压缩为 256 个 Element)
  dit_depth: 24             # Element 层级的 DiT 深度 (因为序列短，可以做得极深)
  num_heads: 16             # Multi-head Attention 头数 (1024 / 16 = 64 dim/head)
  sinkhorn_iters: 3         # 最优传输路由的迭代次数 (3次通常已收敛且能保持梯度稳定)

data:
  meta_path: "data/train_meta.jsonl"
  video_dir: "data/raw_videos/"
  num_frames: 32            # 每次流式抽取的 Chunk 长 (T)
  frame_stride: 2           # 抽帧步长 (Stride=2 代表跨越 64 帧的真实物理时长)
  spatial_size: 256         # VAE 裁剪的基准空间分辨率 (H, W)
  batch_size: 4             # 单 GPU Batch Size (基于 H100 80G 预估)
  num_workers: 8            # Decord 预加载多线程数

training:
  learning_rate: 1.0e-4     # 基础学习率
  weight_decay: 0.05        # AdamW 权重衰减
  max_epochs: 100           # 总训练 Epoch 数
  
  # 认知架构的核心正则化系数
  lambda_ent: 0.1           # 熵损失权重 (强迫网格硬归属)
  lambda_ortho: 0.1         # 正交损失权重 (强迫元素解耦互斥)
  
  # 流匹配 (Flow Matching) 设置
  sigma_min: 1.0e-5
  
  # 渐进式训练阶段 (1: 路由冷启动, 2: 动力学流匹配, 3: 联合微调)
  current_phase: 1